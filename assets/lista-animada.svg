<g transform="translate(0,468)" opacity="0.7"><path style="animation:wv1 10s linear infinite reverse" d="M0 0 q55 -12 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V90 H0Z" fill="url(#gm)"/></g>
