><tspan font-weight="400">conectadas al mismo backend que mis proyectos web.</tspan></text></g><g class="glow" style="animation-delay:1.35s" filter="url(#blur)"><text x="34" y="254" class="e">🧩</text><text x="72" y="254"><tspan font-weight="400">Me gusta construir productos de principio a fin, con orden y código limpio.</tspan></text></g><g class="txt"><text x="34" y="254" class="e">🧩</text><text x="72" y="254"><tspan font-weight="400">Me gusta construir productos de principio a fin, con orden y código limpio.</tspan></text></g><g class="glow" style="animation-delay:1.80s" filter="url(#blur)"><text x="34" y="294" class="e">🤖</text><text x="72" y="294"><tspan font-weight="400">Me gusta el desarrollo web + la integración con IA.</tspan></text></g><g class="txt"><text x="34" y="294" class="e">🤖</text><text x="72" y="294"><tspan font-weight="400">Me gusta el desarrollo web + la integración con IA.</tspan></text></g><g class="glow" style="animation-delay:2.25s" filter="url(#blur)"><text x="34" y="334" class="e">🌐</text><text x="72" y="334"><tspan font-weight="400">Creo sitios web visuales, atractivos y fáciles de usar.</tspan></text></g><g class="txt"><text x="34" y="334" class="e">🌐</text><text x="72" y="334"><tspan font-weight="400">Creo sitios web visuales, atractivos y fáciles de usar.</tspan></text></g><g class="glow" style="animation-delay:2.70s" filter="url(#blur)"><text x="34" y="374" class="e">🔐</text><text x="72" y="374"><tspan font-weight="400">Me enfoco también en seguridad web: autenticación y roles con Spring Security.</tspan></text></g><g class="txt"><text x="34" y="374" class="e">🔐</text><text x="72" y="374"><tspan font-weight="400">Me enfoco también en seguridad web: autenticación y roles con Spring Security.</tspan></text></g><g class="glow" style="animation-delay:3.15s" filter="url(#blur)"><text x="34" y="414" class="e">🎯</text><text x="72" y="414"><tspan font-weight="400">Mi meta: crear productos web con IA que resuelvan problemas reales.</tspan></tex