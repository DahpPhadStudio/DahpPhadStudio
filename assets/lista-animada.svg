<svg xmlns="http://www.w3.org/2000/svg" width="840" height="516" viewBox="0 0 840 516" role="img" aria-label="Lista de presentación de Davinchy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00c6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490" stop-opacity=".9"/><stop offset="1" stop-color="#0e7490" stop-opacity=".15"/></linearGradient>
<linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0891b2" stop-opacity=".9"/><stop offset="1" stop-color="#0891b2" stop-opacity=".15"/></linearGradient>
<linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".85"/><stop offset="1" stop-color="#14b8a6" stop-opacity=".2"/></linearGradient>
<filter id="blur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="bglow"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="c"><rect x="2" y="2" width="836" height="512" rx="16"/></clipPath>
</defs>
<style>
text{font-family:"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:17px;fill:#e6edf3}
.glow text{fill:#39ff88}
.glow{opacity:0;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%{opacity:0}12%{opacity:1}32%{opacity:0}100%{opacity:0}}
.txt{animation:in 1s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.run{animation:run 5s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
@keyframes wv0{to{transform:translateX(-300px)}}
@keyframes wv1{to{transform:translateX(-220px)}}
@keyframes wv2{to{transform:translateX(-170px)}}
</style>
<rect width="840" height="516" rx="18" fill="#0d1117"/>
<g clip-path="url(#c)">
<g transform="translate(0,476)" opacity="0.55"><path class="wv" style="animation:wv0 16s linear infinite " d="M0 0 q75 -9 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V90 H0Z" fill="url(#gb)"/></g>
<g transform="translate(0,484)" opacity="0.7"><path class="wv" style="animation:wv1 10s linear infinite reverse" d="M0 0 q55 -12 110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 t110 0 V90 H0Z" fill="url(#gm)"/></g>
<g transform="translate(0,492)" opacity="0.9"><path class="wv" style="animation:wv2 6.5s linear infinite " d="M0 0 q42.5 -9 85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 t85 0 V90 H0Z" fill="url(#gf)"/></g>
</g>
<rect x="2" y="2" width="836" height="512" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
<rect class="run" x="2" y="2" width="836" height="512" rx="16" fill="none" stroke="url(#g)" stroke-width="3" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round" filter="url(#bglow)"/>
<rect class="run" x="2" y="2" width="836" height="512" rx="16" fill="none" stroke="url(#g)" stroke-width="2" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/>
<g class="glow" style="animation-delay:0.00s" filter="url(#blur)" fill="#39ff88"><text x="34" y="62" class="e">🤝</text><text x="72" y="62"><tspan font-weight="400">Me enfoco en clientes independientes, emprendedores y negocios</tspan></text><text x="72" y="86"><tspan font-weight="400">que quieren dar el salto al mundo digital: creo soluciones web a su medida,</tspan></text><text x="72" y="110"><tspan font-weight="400">con tecnología e IA para ayudarlos a crecer.</tspan></text></g><g class="txt"><text x="34" y="62" class="e">🤝</text><text x="72" y="62"><tspan font-weight="400">Me enfoco en clientes independientes, emprendedores y negocios</tspan></text><text x="72" y="86"><tspan font-weight="400">que quieren dar el salto al mundo digital: creo soluciones web a su medida,</tspan></text><text x="72" y="110"><tspan font-weight="400">con tecnología e IA para ayudarlos a crecer.</tspan></text></g><g class="glow" style="animation-delay:0.45s" filter="url(#blur)" fill="#39ff88"><text x="34" y="150" class="e">🚀</text><text x="72" y="150"><tspan font-weight="400">Creador de </tspan><tspan font-weight="700">Dahp Phad Studio</tspan><tspan font-weight="400">, un sistema de gestión de negocios con IA.</tspan></text></g><g class="txt"><text x="34" y="150" class="e">🚀</text><text x="72" y="150"><tspan font-weight="400">Creador de </tspan><tspan font-weight="700">Dahp Phad Studio</tspan><tspan font-weight="400">, un sistema de gestión de negocios con IA.</tspan></text></g><g class="glow" style="animation-delay:0.90s" filter="url(#blur)" fill="#39ff88"><text x="34" y="190" class="e">👨‍💻</text><text x="72" y="190"><tspan font-weight="400">Desarrollo aplicaciones web completas, desde la base de datos hasta la pantalla.</tspan></text></g><g class="txt"><text x="34" y="190" class="e">👨‍💻</text><text x="72" y="190"><tspan font-weight="400">Desarrollo aplicaciones web completas, desde la base de datos hasta la pantalla.</tspan></text></g><g class="glow" style="animation-delay:1.35s" filter="url(#blur)" fill="#39ff88"><text x="34" y="230" class="e">🐧</text><text x="72" y="230"><tspan font-weight="400">Dato curioso: mi sistema operativo favorito para desarrollar es </tspan><tspan font-weight="700">Arch Linux</tspan><tspan font-weight="400">.</tspan></text></g><g class="txt"><text x="34" y="230" class="e">🐧</text><text x="72" y="230"><tspan font-weight="400">Dato curioso: mi sistema operativo favorito para desarrollar es </tspan><tspan font-weight="700">Arch Linux</tspan><tspan font-weight="400">.</tspan></text></g><g class="glow" style="animation-delay:1.80s" filter="url(#blur)" fill="#39ff88"><text x="34" y="270" class="e">🧩</text><text x="72" y="270"><tspan font-weight="400">Me gusta construir productos de principio a fin, con orden y código limpio.</tspan></text></g><g class="txt"><text x="34" y="270" class="e">🧩</text><text x="72" y="270"><tspan font-weight="400">Me gusta construir productos de principio a fin, con orden y código limpio.</tspan></text></g><g class="glow" style="animation-delay:2.25s" filter="url(#blur)" fill="#39ff88"><text x="34" y="310" class="e">🤖</text><text x="72" y="310"><tspan font-weight="400">Me gusta el desarrollo web + la integración con IA.</tspan></text></g><g class="txt"><text x="34" y="310" class="e">🤖</text><text x="72" y="310"><tspan font-weight="400">Me gusta el desarrollo web + la integración con IA.</tspan></text></g><g class="glow" style="animation-delay:2.70s" filter="url(#blur)" fill="#39ff88"><text x="34" y="350" class="e">🌐</text><text x="72" y="350"><tspan font-weight="400">Creo sitios web visuales, atractivos y fáciles de usar.</tspan></text></g><g class="txt"><text x="34" y="350" class="e">🌐</text><text x="72" y="350"><tspan font-weight="400">Creo sitios web visuales, atractivos y fáciles de usar.</tspan></text></g><g class="glow" style="animation-delay:3.15s" filter="url(#blur)" fill="#39ff88"><text x="34" y="390" class="e">🔐</text><text x="72" y="390"><tspan font-weight="400">Me enfoco también en seguridad web: autenticación y roles con Spring Security.</tspan></text></g><g class="txt"><text x="34" y="390" class="e">🔐</text><text x="72" y="390"><tspan font-weight="400">Me enfoco también en seguridad web: autenticación y roles con Spring Security.</tspan></text></g><g class="glow" style="animation-delay:3.60s" filter="url(#blur)" fill="#39ff88"><text x="34" y="430" class="e">🎯</text><text x="72" y="430"><tspan font-weight="400">Mi meta: crear productos web con IA que resuelvan problemas reales.</tspan></text></g><g class="txt"><text x="34" y="430" class="e">🎯</text><text x="72" y="430"><tspan font-weight="400">Mi meta: crear productos web con IA que resuelvan problemas reales.</tspan></text></g>
</svg>