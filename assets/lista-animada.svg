<style>
text{font-family:"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:17px;fill:#e6edf3}
.glow text{fill:#39ff88}
.glow{opacity:0;animation:pulse 5s ease-in-out infinite}
