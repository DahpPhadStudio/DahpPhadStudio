.t0{fill:#e6edf3}.t1{fill:#39ff88}.t2{fill:#c8ffe0}
.sub{fill:#b6c0cc}
.glow text{fill:#39ff88}
.glow{opacity:0;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%{opacity:0}12%{opacity:1}32%{opacity:0}100%{opacity:0}}
.txt{animation:in 1s ease-out both}
.in{animation:in 1s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.run{animation:run 6s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.sw{animation:sw 5.5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(0)}72%{transform:translateX(1140px)}100%{transform:translateX(1140px)}}
.dr{stroke-dasharray:100 100;stroke-dashoffset:100;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:100}30%{stroke-dashoffset:0}80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.bk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%{opacity:1}50%{opacity:0}}
.dt{animation:dt 2.4s ease-in-out infinite}
@keyframes dt{0%,100%{opacity:.35}50%{opacity:1}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.8) rotate(0deg);opacity:.45;fill-opacity:0;stroke:#e6edf3}35%{transform:scale(1.25) rotate(18deg);opacity:1;fill-opacity:.85;stroke:#c8ffe0}60%{transform:scale(.95) rotate(0deg);opacity:.75;fill-opacity:.1;stroke:#e6edf3}}
</style>
