<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Hi, I am Davinchy. Soy desarrollador de software y me apasiona crear sitios web visualmente atractivos y fáciles de usar." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
